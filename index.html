<!doctype html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Oila</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
:root{
  --fb-bg2:#f1f2f6; --fb-card:#ffffff; --fb-text:#15181d; --fb-hint:#8a8f98; --fb-btn:#2ea66f; --fb-btn-text:#ffffff;
}
@media (prefers-color-scheme: dark){
  :root{ --fb-bg2:#0e1621; --fb-card:#17212b; --fb-text:#f2f4f7; --fb-hint:#7d8b99; --fb-btn:#3fb27f; }
}
:root{
  --bg: var(--tg-theme-secondary-bg-color, var(--fb-bg2));
  --card: var(--tg-theme-section-bg-color, var(--tg-theme-bg-color, var(--fb-card)));
  --text: var(--tg-theme-text-color, var(--fb-text));
  --hint: var(--tg-theme-hint-color, var(--fb-hint));
  --accent: var(--tg-theme-button-color, var(--fb-btn));
  --accent-text: var(--tg-theme-button-text-color, var(--fb-btn-text));
  --green:#2fa36b; --red:#e2513d; --line: color-mix(in srgb, var(--hint) 22%, transparent);
  --soft: color-mix(in srgb, var(--accent) 12%, transparent);
  --r:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
button,input{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
.hidden{display:none!important}
#app{max-width:640px;margin:0 auto;padding:12px 16px calc(84px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;justify-content:space-between;margin:4px 0 14px}
.top h1{margin:0;font-size:22px;letter-spacing:-.3px}
.top .sub{color:var(--hint);font-size:13px}
.icon-btn{width:40px;height:40px;border-radius:12px;background:var(--card);font-size:18px}
.seg{display:flex;background:var(--card);border-radius:12px;padding:3px;margin-bottom:12px}
.seg button{flex:1;padding:8px 4px;border-radius:9px;font-size:14px;color:var(--hint);font-weight:500}
.seg button.on{background:var(--accent);color:var(--accent-text)}
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{white-space:nowrap;padding:6px 12px;border-radius:999px;background:var(--card);font-size:13px;border:1px solid var(--line)}
.chip.on{background:var(--soft);border-color:var(--accent);color:var(--accent);font-weight:600}
.card{background:var(--card);border-radius:var(--r);padding:12px 14px;margin-bottom:10px}
.slot{display:flex;align-items:center;gap:12px;width:100%;text-align:left}
.slot .emo{font-size:26px;width:44px;height:44px;border-radius:12px;background:var(--soft);display:grid;place-items:center;flex:none}
.slot .body{flex:1;min-width:0}
.slot .lbl{font-size:12px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px}
.slot .nm{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{font-size:12px;color:var(--hint)}
.reroll{width:36px;height:36px;border-radius:10px;background:var(--bg);font-size:16px;flex:none}
.btn{display:block;width:100%;padding:13px;border-radius:12px;background:var(--card);font-weight:600;text-align:center;margin-bottom:10px}
.btn.primary{background:var(--accent);color:var(--accent-text)}
.btn.danger{color:var(--red)}
.row2{display:flex;gap:10px}.row2 .btn{flex:1}
.total{display:flex;justify-content:space-between;color:var(--hint);font-size:13px;margin:2px 4px 12px}
.day h3{margin:0 0 6px;font-size:14px;display:flex;justify-content:space-between}
.day h3 span{color:var(--hint);font-weight:400}
.day.now{outline:2px solid var(--accent)}
.mini{display:flex;gap:8px;padding:5px 0;width:100%;text-align:left;font-size:14px;border-top:1px solid var(--line)}
.mini:first-of-type{border-top:0}
.search{width:100%;padding:10px 12px;border-radius:12px;border:1px solid var(--line);background:var(--card);margin-bottom:10px;outline:none}
.rcard{display:flex;gap:12px;align-items:center;width:100%;text-align:left}
.empty{text-align:center;color:var(--hint);padding:28px 8px}
.check{display:flex;align-items:center;gap:10px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.check:first-child{border-top:0}
.box{width:22px;height:22px;border-radius:7px;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;flex:none}
.check.done .box{background:var(--accent);border-color:var(--accent);color:var(--accent-text)}
.check.done .t{text-decoration:line-through;color:var(--hint)}
.check .c{margin-left:auto;font-size:12px;color:var(--hint)}
/* finance */
.month{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.month b{font-size:17px}
.month button{width:38px;height:38px;border-radius:10px;background:var(--card);font-size:18px}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sum .card{margin:0}
.sum .k{font-size:12px;color:var(--hint)}
.sum .v{font-size:17px;font-weight:700;margin-top:2px}
.sum .full{grid-column:1/-1}
.sum .full .v{font-size:24px}
.pos{color:var(--green)}.neg{color:var(--red)}
.bar{height:8px;border-radius:99px;background:var(--bg);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over i{background:var(--red)}
.catrow{margin:8px 0}
.catrow .h{display:flex;justify-content:space-between;font-size:14px}
.sec{font-size:13px;color:var(--hint);text-transform:uppercase;letter-spacing:.4px;margin:16px 4px 6px}
.tx{display:flex;align-items:center;gap:12px;width:100%;text-align:left;padding:9px 0;border-top:1px solid var(--line)}
.tx:first-child{border-top:0}
.tx .emo{font-size:20px;width:38px;height:38px;border-radius:11px;background:var(--bg);display:grid;place-items:center;flex:none}
.tx .body{flex:1;min-width:0}
.tx .body div:first-child{font-weight:500}
.tx .amt{font-weight:700;white-space:nowrap}
/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--line);padding:6px 8px calc(6px + env(safe-area-inset-bottom))}
.tabs button{flex:1;padding:6px;border-radius:12px;color:var(--hint);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
.tabs button span:first-child{font-size:22px}
.tabs button.on{color:var(--accent);font-weight:600}
/* sheet */
.sheet-wrap{position:fixed;inset:0;z-index:20}
.sheet-bg{position:absolute;inset:0;background:rgba(0,0,0,.45)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;max-height:90vh;overflow:auto;background:var(--bg);border-radius:20px 20px 0 0;padding:8px 16px calc(20px + env(safe-area-inset-bottom));animation:up .22s ease}
@keyframes up{from{transform:translateY(40px);opacity:.4}}
.grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:4px auto 12px}
.sheet h2{margin:0 0 4px;font-size:21px}
.stats{display:flex;gap:8px;margin:12px 0}
.stats div{flex:1;background:var(--card);border-radius:12px;padding:8px;text-align:center;font-size:12px;color:var(--hint)}
.stats b{display:block;font-size:16px;color:var(--text)}
.note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
.ing{list-style:none;margin:0;padding:0}
.ing li{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-top:1px solid var(--line)}
.ing li:first-child{border-top:0}
.ing li span{color:var(--hint);text-align:right}
.steps{margin:0;padding-left:20px}.steps li{margin:6px 0}
.field{margin-bottom:12px}
.field label{display:block;font-size:13px;color:var(--hint);margin:0 4px 6px}
.input{width:100%;padding:12px;border-radius:12px;border:1px solid var(--line);background:var(--card);outline:none}
.input.big{font-size:26px;font-weight:700;text-align:center}
.grid{display:flex;flex-wrap:wrap;gap:6px}
.toast{position:fixed;left:50%;bottom:96px;transform:translateX(-50%);background:rgba(20,20,20,.88);color:#fff;padding:9px 16px;border-radius:99px;font-size:14px;opacity:0;pointer-events:none;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}
.loading{text-align:center;color:var(--hint);padding:60px 0}
</style>
</head>

/* ================= Telegram ================= */
const tg = window.Telegram && window.Telegram.WebApp;
const inTG = !!(tg && tg.initData);
if (tg) { try { tg.ready(); tg.expand(); } catch (e) {} }
const useCloud = !!(inTG && tg.isVersionAtLeast && tg.isVersionAtLeast('6.9') && tg.CloudStorage);
function haptic(kind){ try{ if(inTG) kind==='ok'?tg.HapticFeedback.notificationOccurred('success'):tg.HapticFeedback.impactOccurred('light'); }catch(e){} }

/* ================= Storage (Telegram CloudStorage, chunked; localStorage fallback) ================= */
const CHUNK = 3800;
const cloudGet = keys => new Promise(res => tg.CloudStorage.getItems(keys, (err, v) => res(err ? {} : (v || {}))));
const cloudSet = (k, v) => new Promise(res => tg.CloudStorage.setItem(k, v, () => res()));
const cloudDel = ks => new Promise(res => tg.CloudStorage.removeItems(ks, () => res()));
const Store = {
  _n: {},
  async get(key){
    if (!useCloud) { try { const v = localStorage.getItem('fam_' + key); return v ? JSON.parse(v) : null; } catch (e) { return null; } }
    const meta = await cloudGet([key + '_n']);
    const n = parseInt(meta[key + '_n'] || '0', 10); this._n[key] = n;
    if (!n) return null;
    const keys = Array.from({length:n}, (_, i) => key + '_' + i);
    const vals = await cloudGet(keys);
    try { return JSON.parse(keys.map(k => vals[k] || '').join('')); } catch (e) { return null; }
  },
  async set(key, obj){
    const s = JSON.stringify(obj);
    if (!useCloud) { try { localStorage.setItem('fam_' + key, s); } catch (e) {} return; }
    const parts = []; for (let i = 0; i < s.length; i += CHUNK) parts.push(s.slice(i, i + CHUNK));
    for (let i = 0; i < parts.length; i++) await cloudSet(key + '_' + i, parts[i]);
    await cloudSet(key + '_n', String(parts.length));
    const old = this._n[key] || 0;
    if (old > parts.length) await cloudDel(Array.from({length: old - parts.length}, (_, i) => key + '_' + (parts.length + i)));
    this._n[key] = parts.length;
  }
};
const timers = {};
function save(key){ clearTimeout(timers[key]); timers[key] = setTimeout(() => Store.set(key, key === 'cfg' ? cfg : key === 'menu' ? menu : tx), 400); }

["s3","turkic","soup",260,35,"Mercimek sho'rvasi","Red lentil soup (mercimek)","Qizil yasmiq: 150 g; Piyoz: 1 dona; Sabzi: 1 dona; Kartoshka: 1 dona; Pomidor pastasi: 1 osh.q.; Limon: 1/2 dona","Red lentils: 150 g; Onion: 1; Carrot: 1; Potato: 1; Tomato paste: 1 tbsp; Lemon: 1/2","Piyoz va sabzini yengil qovuring.|Yasmiq, kartoshka va suv qo'shib 25 daqiqa qaynating.|Blenderda ezing, limon bilan torting.","Lightly sauté onion and carrot.|Add lentils, potato and water; simmer 25 min.|Blend smooth, serve with lemon.","Arzon, oqsilga boy va oshqozonga yengil.","Cheap, protein-rich and easy on the stomach."],
["s4","uzbek","soup",280,60,"Sabzavotli sho'rva","Vegetable shurpa","Qo'y yoki mol go'shti: 250 g; Kartoshka: 3 dona; Sabzi: 2 dona; Bulg'or qalampiri: 1 dona; Pomidor: 2 dona; Piyoz: 1 dona; Ko'katlar: 1 bog'","Lamb or beef: 250 g; Potatoes: 3; Carrots: 2; Bell pepper: 1; Tomatoes: 2; Onion: 1; Fresh herbs: 1 bunch","Go'shtni sovuq suvga solib, ko'pigini olib qaynating.|Yirik to'g'ralgan sabzavotlarni qo'shing.|Past olovda 40 daqiqa pishirib, ko'kat seping.","Start meat in cold water, skim and boil.|Add chunky vegetables.|Simmer 40 minutes, finish with herbs.","Qovurilmagan — yog' kam, vitaminlar saqlanadi.","Not fried — low fat, vitamins preserved."],
["s5","intl","soup",240,40,"Minestrone","Minestrone","Loviya (konserva): 200 g; Kabachok: 1 dona; Sabzi: 1 dona; Selderey: 1 poya; Pomidor: 2 dona; To'liq donli makaron: 50 g","Canned beans: 200 g; Zucchini: 1; Carrot: 1; Celery: 1 stalk; Tomatoes: 2; Wholegrain pasta: 50 g","Sabzavotlarni kubik qilib to'g'rang.|Zaytun moyida yengil qovurib, suv va pomidor qo'shing.|Loviya va makaronni solib 15 daqiqa pishiring.","Dice the vegetables.|Sauté in olive oil, add water and tomato.|Add beans and pasta, cook 15 minutes.","Sabzavot va tola ko'p, kaloriya kam.","Lots of vegetables and fibre, low calorie."],
["s6","intl","soup",210,25,"Brokkoli krem-sho'rvasi","Broccoli cream soup","Brokkoli: 400 g; Kartoshka: 1 dona; Piyoz: 1 dona; Sut: 150 ml; Sarimsoq: 1 tishcha","Broccoli: 400 g; Potato: 1; Onion: 1; Milk: 150 ml; Garlic: 1 clove","Piyoz va sarimsoqni yumshating.|Brokkoli va kartoshkani suvda 15 daqiqa qaynating.|Sut qo'shib blenderda ezing.","Soften onion and garlic.|Boil broccoli and potato 15 minutes.|Add milk and blend smooth.","C va K vitaminlariga boy, bolalar ham yaxshi yeydi.","Rich in vitamins C and K; kids eat it too."],

["m5","uzbek","main",400,90,"Dolma (tok bargida)","Dolma in vine leaves","Tok bargi: 30 dona; Yog'siz qiyma: 400 g; Guruch: 80 g; Piyoz: 1 dona; Ko'katlar: 1 bog'; Qatiq: tortish uchun","Vine leaves: 30; Lean minced meat: 400 g; Rice: 80 g; Onion: 1; Herbs: 1 bunch; Yogurt: to serve","Qiyma, guruch, piyoz va ko'katlarni aralashtiring.|Tok bargiga o'rang.|Qozonga terib, suv qo'shib 50 daqiqa dimlang.","Mix mince, rice, onion and herbs.|Roll in vine leaves.|Pack into a pot, add water and simmer 50 minutes.","Qovurilmaydi; tok bargi antioksidantlarga boy.","Not fried; vine leaves are rich in antioxidants."],

  i:[["salary","💼","Maosh","Salary"],["biz","📈","Biznes","Business"],["side","💵","Qo'shimcha","Side income"],["gift","🎁","Sovg'a","Gift"],["other","📦","Boshqa","Other"]]
};
const catInfo = (type, k) => CATS[type].find(c => c[0] === k) || CATS[type][CATS[type].length - 1];

/* ================= State ================= */
let cfg = {lang:'uz', cuisine:'all', budget:0, members:null};
let menu = {today:null, week:null, favs:[], shop:{}};
let tx = []; // [id, 'i'|'e', amount, cat, 'YYYY-MM-DD', note, member]
const ui = {tab:'menu', sub:'today', rcat:'all', q:'', favOnly:false, month:'', sheet:null, draft:null, newMember:''};

/* ================= Helpers ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const t = k => (T[cfg.lang] || T.uz)[k] ?? k;
const li = () => cfg.lang === 'en' ? 1 : 0;
const pad = n => String(n).padStart(2, '0');
const iso = d => d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
const todayISO = () => iso(new Date());
const addDays = (s, n) => { const [y,m,d] = s.split('-').map(Number); return iso(new Date(y, m - 1, d + n)); };
const mondayISO = () => { const d = new Date(); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return iso(d); };
const fmtNum = n => String(Math.round(+n || 0)).replace(/\B(?=(\d{3})+(?!\d))/g, ' ');
const money = n => fmtNum(n) + ' ' + t('cur');
const dayLabel = s => { const [y,m,d] = s.split('-').map(Number); const wd = (new Date(y, m - 1, d).getDay() + 6) % 7; return { wd: t('days')[wd], dm: d + ' ' + t('months')[m - 1] }; };
function toast(msg){ const el = $('#toast'); el.textContent = msg; el.classList.add('show'); clearTimeout(el._t); el._t = setTimeout(() => el.classList.remove('show'), 1600); }
function confirmBox(msg){ return new Promise(res => { try { if (inTG && tg.isVersionAtLeast('6.2')) return tg.showConfirm(msg, ok => res(ok)); } catch (e) {} res(window.confirm(msg)); }); }

/* ================= Menu logic ================= */
function pick(cat, avoid){
  let pool = RECIPES.filter(r => r.cat === cat && (cfg.cuisine === 'all' || r.cu === cfg.cuisine));
  if (!pool.length) pool = RECIPES.filter(r => r.cat === cat);
  const fresh = pool.filter(r => !(avoid || []).includes(r.id));
  const src = fresh.length ? fresh : pool;
  return src[Math.floor(Math.random() * src.length)].id;
}
function genToday(){
  const prev = menu.today && menu.today.s;
  const s = {}; SLOTS.forEach(c => s[c] = pick(c, prev ? [prev[c]] : []));
  menu.today = {date: todayISO(), s}; save('menu');
}
function genWeek(){
  const used = {}; SLOTS.forEach(c => used[c] = []);
  const days = [];
  for (let i = 0; i < 7; i++) { const d = {}; SLOTS.forEach(c => { d[c] = pick(c, used[c]); used[c].push(d[c]); }); days.push(d); }
  menu.week = {start: mondayISO(), days}; menu.shop = {}; save('menu');
}
function shopItems(){
  const map = {};
  (menu.week ? menu.week.days : []).forEach(d => SLOTS.forEach(c => {
    const r = byId(d[c]); if (!r) return;
    r.ing[li()].forEach(x => {
      const name = x.split(':')[0].trim(); if (!name) return;
      map[name] = (map[name] || 0) + 1;
    });
  }));
  return Object.entries(map).sort((a, b) => a[0].localeCompare(b[0]));
}

/* ================= Views ================= */
function renderChrome(){
  document.documentElement.lang = cfg.lang;
  $('#hTitle').textContent = ui.tab === 'menu' ? '🍽 ' + t('tabMenu') : '💰 ' + t('tabFin');
  const u = inTG && tg.initDataUnsafe && tg.initDataUnsafe.user;
  $('#hSub').textContent = t('hi') + (u && u.first_name ? ', ' + u.first_name : '') + ' 👋';
  $('#tabs').innerHTML = [['menu','🍽','tabMenu'],['fin','💰','tabFin']].map(([k,e,l]) =>
    `<button class="${ui.tab===k?'on':''}" data-a="tab" data-v="${k}"><span>${e}</span><span>${t(l)}</span></button>`).join('');
}
function render(){
  renderChrome();
  $('#view').innerHTML = ui.tab === 'menu' ? vMenu() : vFin();
  if (ui.tab === 'menu' && ui.sub === 'recipes') renderRList();
}
function cuisineChips(){
  return `<div class="chips">${['all','uzbek','turkic','intl'].map(c =>
    `<button class="chip ${cfg.cuisine===c?'on':''}" data-a="cuisine" data-v="${c}">${c==='all'?'🍽':FLAG[c]} ${t(c)}</button>`).join('')}</div>`;
}
function vMenu(){
  const seg = `<div class="seg">${['today','week','recipes','shop'].map(s =>
    `<button class="${ui.sub===s?'on':''}" data-a="sub" data-v="${s}">${t(s)}</button>`).join('')}</div>`;
  let body = '';
  if (ui.sub === 'today') body = cuisineChips() + vToday();
  else if (ui.sub === 'week') body = cuisineChips() + vWeek();
  else if (ui.sub === 'recipes') body = cuisineChips() + vRecipes();
  else body = vShop();
  return seg + body;
}
function vToday(){
  let kcal = 0;
  const cards = SLOTS.map(c => {
    const r = byId(menu.today.s[c]); kcal += r.kcal;
    return `<div class="card"><div class="slot">
      <button class="slot" data-a="open" data-v="${r.id}" style="flex:1;min-width:0">
        <div class="emo">${EMO[c]}</div>
        <div class="body"><div class="lbl">${t(c)}</div><div class="nm">${esc(r.name[li()])}</div>
        <div class="meta">${FLAG[r.cu]} ${r.kcal} ${t('kcal')} · ⏱ ${r.min} ${t('min')}</div></div>
      </button>
      <button class="reroll" data-a="reroll" data-v="${c}" aria-label="shuffle">🔄</button>
    </div></div>`;
  }).join('');
  return cards + `<div class="total"><span>${t('dayTotal')}</span><b>≈ ${fmtNum(kcal)} ${t('kcal')}</b></div>
    <button class="btn primary" data-a="newToday">${t('newMenu')}</button>`;
}
function vWeek(){
  const now = todayISO();
  const days = menu.week.days.map((d, i) => {
    const date = addDays(menu.week.start, i), dl = dayLabel(date);
    return `<div class="card day ${date===now?'now':''}"><h3>${dl.wd}<span>${dl.dm}</span></h3>
      ${SLOTS.map(c => { const r = byId(d[c]); return `<button class="mini" data-a="open" data-v="${r.id}"><span>${EMO[c]}</span><span>${esc(r.name[li()])}</span></button>`; }).join('')}
    </div>`;
  }).join('');
  return `<div class="row2"><button class="btn" data-a="newWeek">${t('newWeek')}</button><button class="btn primary" data-a="sub" data-v="shop">${t('toShop')}</button></div>` + days;
}
function vRecipes(){
  return `<div class="chips">
      <button class="chip ${ui.rcat==='all'?'on':''}" data-a="rcat" data-v="all">${t('all')}</button>
      ${SLOTS.map(c => `<button class="chip ${ui.rcat===c?'on':''}" data-a="rcat" data-v="${c}">${EMO[c]} ${t(c)}</button>`).join('')}
      <button class="chip ${ui.favOnly?'on':''}" data-a="favOnly">${t('favs')}</button>
    </div>
    <input class="search" data-f="q" placeholder="${t('search')}" value="${esc(ui.q)}">
    <div id="rlist"></div>`;
}
function renderRList(){
  const q = ui.q.trim().toLowerCase();
  const list = RECIPES.filter(r =>
    (cfg.cuisine === 'all' || r.cu === cfg.cuisine) && (ui.rcat === 'all' || r.cat === ui.rcat) &&
    (!ui.favOnly || menu.favs.includes(r.id)) &&
    (!q || (r.name[0] + ' ' + r.name[1] + ' ' + r.ing[li()].join(' ')).toLowerCase().includes(q)));
  $('#rlist').innerHTML = list.length ? list.map(r => `<div class="card"><button class="rcard slot" data-a="open" data-v="${r.id}">
      <div class="emo">${EMO[r.cat]}</div>
      <div class="body"><div class="nm">${menu.favs.includes(r.id)?'❤️ ':''}${esc(r.name[li()])}</div>
      <div class="meta">${FLAG[r.cu]} ${t(r.cu)} · ${t(r.cat)} · ${r.kcal} ${t('kcal')} · ⏱ ${r.min} ${t('min')}</div></div></button></div>`).join('')
    : `<div class="empty">${t('noFound')}</div>`;
}
function vShop(){
  const items = shopItems();
  if (!items.length) return `<div class="empty">—</div>`;
  const dl0 = dayLabel(menu.week.start), dl6 = dayLabel(addDays(menu.week.start, 6));
  return `<div class="meta" style="margin:0 4px 8px">${t('shopHint')}: ${dl0.dm} – ${dl6.dm}</div>
    <div class="card">${items.map(([n, c]) => { const k = encodeURIComponent(n); const on = menu.shop[n];
      return `<button class="check ${on?'done':''}" data-a="shopTog" data-v="${k}"><span class="box">${on?'✓':''}</span><span class="t">${esc(n)}</span><span class="c">${c} ${t('inRecipes')}</span></button>`; }).join('')}</div>
    <button class="btn" data-a="shopClear">${t('shopClear')}</button>`;
}

function vFin(){
  const [y, m] = ui.month.split('-').map(Number);
  const list = tx.filter(x => x[4].slice(0, 7) === ui.month).sort((a, b) => b[4].localeCompare(a[4]) || (b[0] > a[0] ? 1 : -1));
  let inc = 0, exp = 0; list.forEach(x => { if (x[1] === 'i') inc += x[2]; else exp += x[2]; });
  const bal = inc - exp;
  let h = `<div class="month"><button data-a="month" data-v="-1">‹</button><b>${t('months')[m-1]} ${y}</b><button data-a="month" data-v="1">›</button></div>
  <div class="sum">
    <div class="card full"><div class="k">${t('balance')}</div><div class="v ${bal<0?'neg':''}">${bal<0?'−':''}${money(Math.abs(bal))}</div></div>
    <div class="card"><div class="k">⬆️ ${t('income')}</div><div class="v pos">${money(inc)}</div></div>
    <div class="card"><div class="k">⬇️ ${t('expense')}</div><div class="v neg">${money(exp)}</div></div>
  </div>
  <div class="row2"><button class="btn" data-a="addTx" data-v="i" style="color:var(--green)">＋ ${t('income')}</button><button class="btn primary" data-a="addTx" data-v="e">− ${t('expense')}</button></div>`;
  if (cfg.budget > 0) {
    const pct = Math.min(100, exp / cfg.budget * 100), over = exp > cfg.budget;
    h += `<div class="card"><div class="catrow"><div class="h"><span>🎯 ${t('budget')}</span><span>${money(cfg.budget)}</span></div>
      <div class="bar ${over?'over':''}"><i style="width:${pct}%"></i></div>
      <div class="meta" style="margin-top:4px">${over ? money(exp - cfg.budget) + ' ' + t('over') : money(cfg.budget - exp) + ' ' + t('left')}</div></div></div>`;
  }
  const byCat = {}; list.filter(x => x[1] === 'e').forEach(x => byCat[x[3]] = (byCat[x[3]] || 0) + x[2]);
  const cats = Object.entries(byCat).sort((a, b) => b[1] - a[1]);
  if (cats.length) {
    const max = cats[0][1];
    h += `<div class="sec">${t('byCat')}</div><div class="card">${cats.map(([k, v]) => { const c = catInfo('e', k);
      return `<div class="catrow"><div class="h"><span>${c[1]} ${esc(c[li()+2])}</span><span>${money(v)} <span class="meta">${Math.round(v/exp*100)}%</span></span></div><div class="bar"><i style="width:${v/max*100}%"></i></div></div>`; }).join('')}</div>`;
  }
  h += `<div class="sec">${t('history')}</div>`;
  if (!list.length) return h + `<div class="card empty">${t('noTx')}</div>`;
  let cur = '', rows = '';
  list.forEach(x => {
    if (x[4] !== cur) { if (cur) rows += '</div>'; cur = x[4]; const dl = dayLabel(cur); rows += `<div class="meta" style="margin:10px 4px 4px">${dl.dm}, ${dl.wd}</div><div class="card">`; }
    const c = catInfo(x[1], x[3]);
    rows += `<button class="tx" data-a="openTx" data-v="${x[0]}"><span class="emo">${c[1]}</span><span class="body"><div>${esc(c[li()+2])}</div><div class="meta">${esc([x[6], x[5]].filter(Boolean).join(' · '))}</div></span><span class="amt ${x[1]==='i'?'pos':'neg'}">${x[1]==='i'?'+':'−'}${fmtNum(x[2])}</span></button>`;
  });
  return h + rows + '</div>';
}

/* ================= Sheets ================= */
function openSheet(s){ ui.sheet = s; renderSheet(); $('#sheetWrap').classList.remove('hidden'); try { if (inTG) tg.BackButton.show(); } catch (e) {} }
function closeSheet(){ ui.sheet = null; $('#sheetWrap').classList.add('hidden'); try { if (inTG) tg.BackButton.hide(); } catch (e) {} }
function renderSheet(){
  const s = ui.sheet; if (!s) return;
  let h = '<div class="grab"></div>';
  if (s.kind === 'recipe') h += shRecipe(byId(s.id));
  else if (s.kind === 'txNew') h += shTxNew();
  else if (s.kind === 'txView') h += shTxView(tx.find(x => x[0] === s.id));
  else if (s.kind === 'settings') h += shSettings();
  $('#sheet').innerHTML = h;
}
function shRecipe(r){
  const fav = menu.favs.includes(r.id);
  return `<div style="font-size:40px">${EMO[r.cat]}</div><h2>${esc(r.name[li()])}</h2>
    <div class="meta">${FLAG[r.cu]} ${t(r.cu)} · ${t(r.cat)}</div>
    <div class="stats"><div><b>${r.kcal}</b>${t('kcal')} · ${t('perServ')}</div><div><b>${r.min}</b>${t('min')}</div></div>
    <div class="note">💚 <b>${t('why')}:</b> ${esc(r.note[li()])}</div>
    <div class="sec">${t('ingredients')}</div>
    <div class="card"><ul class="ing">${r.ing[li()].map(x => { const [n, q] = x.split(':'); return `<li>${esc(n.trim())}<span>${esc((q || '').trim())}</span></li>`; }).join('')}</ul></div>
    <div class="sec">${t('steps')}</div>
    <div class="card"><ol class="steps">${r.steps[li()].map(x => `<li>${esc(x)}</li>`).join('')}</ol></div>
    <div class="row2"><button class="btn" data-a="fav" data-v="${r.id}">${fav ? t('inFav') : t('addFav')}</button>
    <button class="btn primary" data-a="toToday" data-v="${r.id}">＋ ${t('toToday')}</button></div>`;
}
function shTxNew(){
  const d = ui.draft;
  return `<div class="seg"><button class="${d.type==='e'?'on':''}" data-a="dType" data-v="e">⬇️ ${t('expense')}</button><button class="${d.type==='i'?'on':''}" data-a="dType" data-v="i">⬆️ ${t('income')}</button></div>
    <div class="field"><label>${t('amount')}, ${t('cur')}</label><input class="input big" data-f="amount" inputmode="numeric" placeholder="0" value="${d.amount ? fmtNum(d.amount) : ''}"></div>
    <div class="field"><label>${t('category')}</label><div class="grid">${CATS[d.type].map(c =>
      `<button class="chip ${d.cat===c[0]?'on':''}" data-a="dCat" data-v="${c[0]}">${c[1]} ${esc(c[li()+2])}</button>`).join('')}</div></div>
    ${cfg.members.length ? `<div class="field"><label>${t('who')}</label><div class="grid">${cfg.members.map((m, i) =>
      `<button class="chip ${d.member===m?'on':''}" data-a="dMember" data-v="${i}">${esc(m)}</button>`).join('')}</div></div>` : ''}
    <div class="field"><label>${t('date')}</label><input class="input" type="date" data-f="date" value="${d.date}"></div>
    <div class="field"><label>${t('note')}</label><input class="input" data-f="note" maxlength="80" placeholder="${t('notePh')}" value="${esc(d.note)}"></div>
    <button class="btn primary" data-a="saveTx">${t('save')}</button>`;
}
function shTxView(x){
  if (!x) return '';
  const c = catInfo(x[1], x[3]), dl = dayLabel(x[4]);
  return `<div style="font-size:40px">${c[1]}</div><h2 class="${x[1]==='i'?'pos':'neg'}">${x[1]==='i'?'+':'−'}${money(x[2])}</h2>
    <div class="card" style="margin-top:12px"><ul class="ing">
      <li>${t('category')}<span>${esc(c[li()+2])}</span></li>
      <li>${t('date')}<span>${dl.dm}, ${dl.wd}</span></li>
      ${x[6] ? `<li>${t('who')}<span>${esc(x[6])}</span></li>` : ''}
      ${x[5] ? `<li>${t('note')}<span>${esc(x[5])}</span></li>` : ''}
    </ul></div>
    <button class="btn danger" data-a="delTx" data-v="${x[0]}">🗑 ${t('delete')}</button>`;
}
function shSettings(){
  return `<h2>⚙️ ${t('settings')}</h2>
    <div class="sec">${t('language')}</div>
    <div class="seg"><button class="${cfg.lang==='uz'?'on':''}" data-a="lang" data-v="uz">🇺🇿 O'zbekcha</button><button class="${cfg.lang==='en'?'on':''}" data-a="lang" data-v="en">🇬🇧 English</button></div>
    <div class="sec">${t('members')}</div>
    <div class="card"><div class="grid" style="margin-bottom:10px">${cfg.members.map((m, i) =>
      `<button class="chip" data-a="rmMember" data-v="${i}">${esc(m)} ✕</button>`).join('')}</div>
      <div class="row2"><input class="input" data-f="newMember" placeholder="${t('memberPh')}" maxlength="20" value="${esc(ui.newMember)}"><button class="btn primary" style="width:auto;margin:0;padding:0 16px" data-a="addMember">${t('addMember')}</button></div></div>
    <div class="sec">${t('budget')}, ${t('cur')}</div>
    <input class="input" data-f="budget" inputmode="numeric" placeholder="${t('budgetPh')}" value="${cfg.budget ? fmtNum(cfg.budget) : ''}">
    <p class="meta" style="margin:16px 4px 0">${useCloud ? '☁️ ' + t('storeCloud') : '💻 ' + t('storeLocal')}</p>`;
}

/* ================= Actions ================= */
const ACT = {
  tab: v => { ui.tab = v; haptic(); render(); window.scrollTo(0, 0); },
  sub: v => { ui.sub = v; render(); window.scrollTo(0, 0); },
  cuisine: v => { cfg.cuisine = v; save('cfg'); render(); },
  reroll: v => { menu.today.s[v] = pick(v, [menu.today.s[v]]); save('menu'); haptic(); render(); },
  newToday: () => { genToday(); haptic(); render(); },
  newWeek: () => { genWeek(); haptic(); render(); },
  open: v => openSheet({kind:'recipe', id:v}),
  rcat: v => { ui.rcat = v; render(); },
  favOnly: () => { ui.favOnly = !ui.favOnly; render(); },
  fav: v => { const i = menu.favs.indexOf(v); i < 0 ? menu.favs.push(v) : menu.favs.splice(i, 1); save('menu'); haptic(); renderSheet(); if (ui.sub === 'recipes') renderRList(); },
  toToday: v => { const r = byId(v); menu.today.s[r.cat] = v; save('menu'); closeSheet(); haptic('ok'); toast(t('added')); if (ui.sub === 'today') render(); },
  shopTog: v => { const n = decodeURIComponent(v); menu.shop[n] = !menu.shop[n]; save('menu'); haptic(); render(); },
  shopClear: () => { menu.shop = {}; save('menu'); render(); },
  month: v => { const [y, m] = ui.month.split('-').map(Number); const d = new Date(y, m - 1 + (+v), 1); ui.month = d.getFullYear() + '-' + pad(d.getMonth() + 1); render(); },
  addTx: v => { ui.draft = {type:v, amount:0, cat:CATS[v][0][0], member:cfg.members[0] || '', date:todayISO(), note:''}; openSheet({kind:'txNew'}); },
  dType: v => { ui.draft.type = v; ui.draft.cat = CATS[v][0][0]; renderSheet(); },
  dCat: v => { ui.draft.cat = v; haptic(); renderSheet(); },
  dMember: v => { const m = cfg.members[+v]; ui.draft.member = ui.draft.member === m ? '' : m; renderSheet(); },
  saveTx: () => {
    const d = ui.draft; if (!(d.amount > 0)) { toast(t('enterAmount')); return; }
    tx.push([Date.now().toString(36) + Math.random().toString(36).slice(2, 5), d.type, d.amount, d.cat, d.date || todayISO(), d.note.trim(), d.member]);
    save('tx'); ui.month = (d.date || todayISO()).slice(0, 7); closeSheet(); haptic('ok'); toast(t('saved')); render();
  },
  openTx: v => openSheet({kind:'txView', id:v}),
  delTx: async v => { if (!(await confirmBox(t('confirmDel')))) return; tx = tx.filter(x => x[0] !== v); save('tx'); closeSheet(); toast(t('deleted')); render(); },
  settings: () => openSheet({kind:'settings'}),
  lang: v => { cfg.lang = v; save('cfg'); render(); renderSheet(); },
  rmMember: v => { cfg.members.splice(+v, 1); save('cfg'); renderSheet(); },
  addMember: () => { const n = ui.newMember.trim(); if (!n || cfg.members.includes(n)) return; cfg.members.push(n); ui.newMember = ''; save('cfg'); renderSheet(); },
  close: () => closeSheet()
};
document.addEventListener('click', e => { const el = e.target.closest('[data-a]'); if (!el) return; const f = ACT[el.dataset.a]; if (f) f(el.dataset.v, el); });
document.addEventListener('input', e => {
  const el = e.target, f = el.dataset && el.dataset.f; if (!f) return;
  if (f === 'q') { ui.q = el.value; renderRList(); }
  else if (f === 'amount' || f === 'budget') {
    const digits = el.value.replace(/\D/g, '').slice(0, 13);
    el.value = digits ? fmtNum(digits) : '';
    if (f === 'amount') ui.draft.amount = +digits; else { cfg.budget = +digits; save('cfg'); }
  }
  else if (f === 'note' || f === 'date') ui.draft[f] = el.value;
  else if (f === 'newMember') ui.newMember = el.value;
});
document.addEventListener('keydown', e => { if (e.key === 'Enter' && e.target.dataset && e.target.dataset.f === 'newMember') ACT.addMember(); });
try { if (inTG) tg.BackButton.onClick(closeSheet); } catch (e) {}

/* ================= Init ================= */
(async function init(){
  try {
    const [c, m, x] = await Promise.all([Store.get('cfg'), Store.get('menu'), Store.get('tx')]);
    if (c) Object.assign(cfg, c);
    if (m) menu = Object.assign(menu, m);
    if (Array.isArray(x)) tx = x;
  } catch (e) {}
  if (!cfg.members) { cfg.members = T[cfg.lang].defMembers.slice(); save('cfg'); }
  if (!menu.today || menu.today.date !== todayISO()) genToday();
  if (!menu.week || menu.week.start !== mondayISO()) genWeek();
  menu.today.s && SLOTS.forEach(c => { if (!byId(menu.today.s[c])) menu.today.s[c] = pick(c); });
  ui.month = todayISO().slice(0, 7);
  render();
})();
</script>
</body>
</html>
